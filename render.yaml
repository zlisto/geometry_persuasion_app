services:
  - type: web
    name: geometry-persuasion-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /
